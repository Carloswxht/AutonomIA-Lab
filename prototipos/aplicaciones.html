<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>autonomIA Lab — Aplicaciones útiles</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --bg:#0A0B0D; --surface:#121317; --surface-2:#1A1C22; --surface-3:#212329;
    --border:#24262E; --border-soft:#1C1E24;
    --text:#F3F4F6; --text-dim:#9BA1AE; --text-faint:#5C606C;
    --blue:#3B82F6; --blue-bright:#5B9CFF; --blue-soft:#132342; --blue-line:#1E3A63;
    --green:#22C55E; --green-soft:#0F2A1B;
    --amber:#F5A623; --amber-soft:#332507; --amber-line:#4d3a12;
    --nav-h:66px;
  }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ min-height:100%; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Work Sans',sans-serif; -webkit-font-smoothing:antialiased;
    padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px);
  }
  h1,h2,h3{ font-family:'Space Grotesk',sans-serif; font-weight:600; margin:0; }
  ::selection{ background:var(--blue-soft); color:var(--text); }

  /* ---------- HEADER ---------- */
  header{
    background:linear-gradient(180deg,#101115 0%, #0A0B0D 100%);
    padding:18px 18px 15px; position:sticky; top:0; z-index:10;
    border-bottom:1px solid var(--border-soft);
  }
  .brand{ display:flex; align-items:baseline; gap:2px; }
  .brand-mark{
    font-family:'IBM Plex Mono',monospace; font-size:0.9rem; font-weight:600;
    color:var(--blue-bright); letter-spacing:0.01em;
  }
  .brand-mark::before{ content:'['; color:var(--text-faint); }
  .brand-mark::after{ content:']'; color:var(--text-faint); }
  .brand-cursor{
    display:inline-block; width:7px; height:15px; background:var(--blue-bright);
    margin-left:6px; vertical-align:-2px; animation:blink 1.1s steps(1) infinite;
  }
  @keyframes blink{ 0%,49%{opacity:1;} 50%,100%{opacity:0;} }
  .brand-sub{
    font-family:'Space Grotesk',sans-serif; font-size:1.02rem; font-weight:600;
    color:var(--text); margin:4px 0 0; letter-spacing:-0.01em;
  }
  .brand-sub span{ color:var(--blue-bright); }

  /* ---------- FECHA ---------- */
  .inicio-top{ padding:20px 18px 4px; }
  .inicio-eyebrow{
    font-family:'IBM Plex Mono',monospace; font-size:0.66rem; text-transform:uppercase;
    letter-spacing:0.08em; color:var(--text-faint); margin:0 0 6px;
  }
  .inicio-fecha{ font-family:'Space Grotesk',sans-serif; font-size:1.18rem; font-weight:600; margin:0; text-transform:capitalize; }

  /* ---------- STATS ---------- */
  .kpi-row{ display:flex; gap:10px; padding:16px 18px 6px; }
  .kpi-card{
    flex:1; background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:14px 14px 12px; min-width:0;
  }
  .kpi-label{ font-family:'IBM Plex Mono',monospace; font-size:0.62rem; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-faint); }
  .kpi-value{ font-family:'IBM Plex Mono',monospace; font-size:1.28rem; font-weight:600; color:var(--text); margin-top:6px; }
  .kpi-value.blue{ color:var(--blue-bright); }
  .kpi-value.green{ color:var(--green); }

  /* ---------- TARJETAS DE MÓDULOS ---------- */
  .mod-list{ padding:18px 18px 24px; display:flex; flex-direction:column; gap:10px; }
  .mod-card{
    background:var(--surface); border:1px solid var(--border); border-radius:14px;
    padding:14px 15px; display:flex; align-items:center; gap:13px;
    transition:border-color .15s, transform .1s;
  }
  .mod-card.disponible{ cursor:pointer; }
  .mod-card.disponible:active{ transform:scale(0.98); border-color:var(--blue-line); }
  .mod-icon-wrap{
    flex:0 0 auto; width:42px; height:42px; border-radius:11px; background:var(--surface-2);
    display:flex; align-items:center; justify-content:center; border:1px solid var(--border);
  }
  .mod-card.disponible .mod-icon-wrap{ background:var(--blue-soft); border-color:var(--blue-line); }
  .mod-icon{ width:20px; height:20px; stroke:var(--text-dim); }
  .mod-card.disponible .mod-icon{ stroke:var(--blue-bright); }
  .mod-text{ flex:1; min-width:0; }
  .mod-text h3{ font-size:0.98rem; margin:0 0 2px; }
  .mod-text p{ font-size:0.76rem; color:var(--text-dim); margin:0; line-height:1.35; }
  .mod-badge{
    flex:0 0 auto; font-family:'IBM Plex Mono',monospace; font-size:0.6rem;
    text-transform:uppercase; letter-spacing:0.05em; padding:3px 8px; border-radius:6px;
    background:var(--surface-2); color:var(--text-faint); white-space:nowrap; border:1px solid var(--border);
  }
  .mod-card.disponible .mod-badge{ background:var(--green-soft); color:var(--green); border-color:#1C4B2E; }
  .mod-card.premium .mod-badge{ background:var(--amber-soft); color:var(--amber); border-color:var(--amber-line); }

  /* ---------- NAV INFERIOR ---------- */
  .bottom-nav{
    position:fixed; left:0; right:0; bottom:0; height:calc(var(--nav-h) + env(safe-area-inset-bottom));
    background:#0D0E11; border-top:1px solid var(--border-soft); display:flex; align-items:center; justify-content:center;
    padding-bottom:env(safe-area-inset-bottom); z-index:30;
  }
  .hamburger-btn{
    width:44px; height:44px; background:none; border:none;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition:transform .12s ease;
  }
  .hamburger-btn:active{ transform:scale(0.94); }
  .hamburger-icon{ width:19px; height:14px; position:relative; }
  .h-line{
    position:absolute; left:0; width:100%; height:2px; border-radius:2px; background:var(--blue-bright);
    transition:transform .25s ease, opacity .2s ease, top .25s ease;
  }
  .h-line.l1{ top:0; }
  .h-line.l2{ top:6px; }
  .h-line.l3{ top:12px; }
  .hamburger-btn.open .h-line.l1{ top:6px; transform:rotate(45deg); }
  .hamburger-btn.open .h-line.l2{ opacity:0; }
  .hamburger-btn.open .h-line.l3{ top:6px; transform:rotate(-45deg); }

  .nav-menu-overlay{
    position:fixed; inset:0; z-index:31; background:rgba(6,7,9,0.55);
    opacity:0; pointer-events:none; transition:opacity .2s ease;
  }
  .nav-menu-overlay.open{ opacity:1; pointer-events:auto; }
  .nav-menu{
    position:fixed; left:50%; bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 12px); z-index:32;
    width:min(320px, calc(100vw - 32px)); transform:translateX(-50%) translateY(10px) scale(0.96);
    background:var(--surface); border:1px solid var(--border); border-radius:18px; overflow:hidden;
    opacity:0; pointer-events:none; transition:opacity .18s ease, transform .18s ease;
    box-shadow:0 20px 50px rgba(0,0,0,0.6), 0 0 0 1px rgba(59,130,246,0.06);
  }
  .nav-menu.open{ opacity:1; pointer-events:auto; transform:translateX(-50%) translateY(0) scale(1); }
  .nav-menu-eyebrow{
    font-family:'IBM Plex Mono',monospace; font-size:0.6rem; text-transform:uppercase; letter-spacing:0.07em;
    color:var(--text-faint); padding:14px 16px 8px;
  }
  .nav-menu-item{
    display:flex; align-items:center; gap:12px; width:100%; padding:12px 16px; background:none; border:none;
    border-top:1px solid var(--border-soft); text-align:left; cursor:pointer; font:inherit; color:inherit;
  }
  .nav-menu-item:active{ background:var(--surface-2); }
  .nav-menu-item-icon{
    width:34px; height:34px; border-radius:10px; background:var(--surface-2); flex:0 0 auto;
    display:flex; align-items:center; justify-content:center;
  }
  .nav-menu-item-icon svg{ width:17px; height:17px; stroke:var(--text-dim); }
  .nav-menu-item-text{ flex:1; min-width:0; }
  .nav-menu-item-text .t{ font-family:'Work Sans',sans-serif; font-size:0.9rem; font-weight:600; color:var(--text); }
  .nav-menu-item-text .d{ font-family:'Work Sans',sans-serif; font-size:0.72rem; color:var(--text-faint); margin-top:1px; }

  /* ---------- VISTAS ---------- */
  .view{ display:none; }
  .view.active{ display:block; }
  button.mod-card{ width:100%; text-align:left; font:inherit; color:inherit; }
  .chev{ flex:0 0 auto; width:16px; height:16px; stroke:var(--text-faint); }
  .nav-menu-item.active .nav-menu-item-icon{ background:var(--blue-soft); }
  .nav-menu-item.active .nav-menu-item-icon svg{ stroke:var(--blue-bright); }
  .nav-menu-item.active .t{ color:var(--blue-bright); }
  .nav-menu-item:focus-visible, .mod-card:focus-visible, .btn-primary:focus-visible, .btn-secondary:focus-visible,
  .volver-btn:focus-visible, .hamburger-btn:focus-visible, .fi-btn:focus-visible, .pe-send:focus-visible, .pe-item:focus-visible{ outline:2px solid var(--blue-bright); outline-offset:2px; }

  .volver-btn{
    display:inline-flex; align-items:center; gap:6px; background:none; border:none; color:var(--text-dim);
    font:inherit; font-size:0.84rem; padding:16px 18px 0; cursor:pointer;
  }
  .volver-btn svg{ width:16px; height:16px; stroke:currentColor; }
  .section-intro{ padding:12px 18px 0; }
  .section-intro h2{ font-size:1.3rem; letter-spacing:-0.01em; }
  .section-intro p{ font-size:0.86rem; color:var(--text-dim); line-height:1.5; margin:6px 0 0; max-width:46ch; }

  .apps-more{ margin:0 18px 24px; padding:16px; border:1px dashed var(--border); border-radius:14px; }
  .apps-more h3{ font-size:0.98rem; margin-bottom:4px; }
  .apps-more p{ font-size:0.8rem; color:var(--text-dim); line-height:1.45; margin:0 0 12px; }

  .app-head{ padding:14px 18px 0; }
  .app-pain{ font-size:0.8rem; color:var(--text-faint); line-height:1.45; margin:0 0 8px; max-width:44ch; }
  .app-h{ font-size:1.55rem; letter-spacing:-0.02em; line-height:1.15; max-width:16em; }
  .app-intro{ font-size:0.92rem; color:var(--text-dim); line-height:1.55; margin:12px 0 0; max-width:48ch; }
  .demo-label{ padding:22px 18px 8px; font-size:0.78rem; color:var(--text-faint); display:flex; justify-content:space-between; gap:8px; }
  .demo-label b{ color:var(--text-dim); font-weight:600; }
  .demo{ margin:0 18px; background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:18px; }
  .steps{ list-style:none; margin:0; padding:22px 18px 0; counter-reset:s; }
  .steps h3{ font-size:0.98rem; padding:0 0 12px; }
  .steps li{ counter-increment:s; display:flex; gap:12px; font-size:0.88rem; line-height:1.45; color:var(--text-dim); padding:0 0 12px; }
  .steps li::before{
    content:counter(s); flex:0 0 auto; width:24px; height:24px; border-radius:50%; background:var(--blue-soft); color:var(--blue-bright);
    font-family:'IBM Plex Mono',monospace; font-size:0.74rem; font-weight:600; display:flex; align-items:center; justify-content:center; border:1px solid var(--blue-line);
  }
  .steps li span{ padding-top:2px; }
  .cta-block{ padding:12px 18px 24px; }
  .btn-primary, .btn-secondary{
    display:block; width:100%; border-radius:12px; padding:15px 18px; font:inherit; font-size:0.95rem; font-weight:600; cursor:pointer;
    text-align:center; text-decoration:none; transition:transform .12s ease;
  }
  .btn-primary{ background:var(--blue); color:#fff; border:none; box-shadow:0 10px 28px rgba(59,130,246,0.28); }
  .btn-secondary{ background:var(--surface-2); color:var(--text); border:1px solid var(--border); padding:12px 16px; font-size:0.88rem; }
  .btn-primary:active, .btn-secondary:active{ transform:scale(0.98); }
  .cta-hint{ font-size:0.76rem; color:var(--text-faint); text-align:center; margin:10px 0 0; }

  .fi-clock{ font-family:'IBM Plex Mono',monospace; font-size:2.6rem; font-weight:500; letter-spacing:-0.02em; text-align:center; }
  .fi-chip{
    display:block; width:max-content; margin:10px auto 0; font-size:0.78rem; font-weight:600; padding:5px 12px; border-radius:20px;
    background:var(--surface-2); color:var(--text-dim); border:1px solid var(--border);
  }
  .fi-chip.on{ background:var(--green-soft); color:var(--green); border-color:#1C4B2E; }
  .fi-sub{ text-align:center; font-size:0.8rem; color:var(--text-faint); margin:8px 0 0; min-height:1.2em; }
  .fi-btn{
    display:block; width:100%; margin-top:16px; border:none; border-radius:14px; padding:18px; font:inherit; font-size:1.05rem; font-weight:600;
    background:var(--green); color:#07210f; cursor:pointer; transition:transform .12s ease, background .2s ease;
  }
  .fi-btn:active{ transform:scale(0.98); }
  .fi-btn.out{ background:var(--surface-3); color:var(--text); border:1px solid var(--border); }
  .fi-team{ margin-top:20px; border-top:1px solid var(--border-soft); padding-top:14px; }
  .fi-team-head{ display:flex; justify-content:space-between; align-items:baseline; font-size:0.82rem; color:var(--text-dim); margin-bottom:6px; }
  .fi-team-head b{ font-family:'IBM Plex Mono',monospace; color:var(--text); font-weight:600; }
  .fi-row{ display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--border-soft); font-size:0.88rem; }
  .fi-name{ flex:1; min-width:0; font-weight:500; }
  .fi-time{ font-family:'IBM Plex Mono',monospace; font-size:0.78rem; color:var(--text-faint); }
  .fi-dot{ width:8px; height:8px; border-radius:50%; background:var(--green); flex:0 0 auto; }
  .fi-dot.off{ background:var(--text-faint); }

  .pe-field{ display:flex; flex-direction:column; gap:6px; margin-bottom:12px; }
  .pe-field label{ font-size:0.76rem; color:var(--text-faint); }
  .pe-field select, .pe-field textarea{
    width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:11px 12px;
    font:inherit; font-size:0.9rem; color:var(--text); resize:none;
  }
  .pe-field select:focus, .pe-field textarea:focus{ outline:none; border-color:var(--blue-bright); }
  .pe-two{ display:flex; gap:10px; }
  .pe-two .pe-field{ flex:1; min-width:0; }
  .pe-actions{ display:flex; gap:10px; align-items:center; }
  .pe-photo{
    position:relative; flex:0 0 auto; display:inline-flex; align-items:center; gap:8px; padding:11px 14px; border-radius:10px; cursor:pointer;
    background:var(--surface-2); border:1px solid var(--border); font-size:0.84rem; color:var(--text-dim);
  }
  .pe-photo svg{ width:17px; height:17px; stroke:var(--blue-bright); }
  .pe-photo input{ position:absolute; width:1px; height:1px; opacity:0; pointer-events:none; }
  .pe-photo:focus-within{ outline:2px solid var(--blue-bright); outline-offset:2px; }
  .pe-send{ flex:1; border:none; border-radius:10px; padding:12px 14px; background:var(--blue); color:#fff; font:inherit; font-weight:600; font-size:0.9rem; cursor:pointer; }
  .pe-send:disabled{ background:var(--surface-3); color:var(--text-faint); cursor:default; }
  .pe-prev{ display:none; margin-top:10px; width:72px; height:72px; border-radius:10px; object-fit:cover; border:1px solid var(--border); }
  .pe-prev.show{ display:block; }
  .pe-inbox{ margin-top:20px; border-top:1px solid var(--border-soft); padding-top:14px; }
  .pe-inbox-head{ display:flex; justify-content:space-between; align-items:baseline; font-size:0.82rem; color:var(--text-dim); margin-bottom:10px; }
  .pe-inbox-head b{ font-family:'IBM Plex Mono',monospace; color:var(--text); }
  .pe-list{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
  .pe-item{
    display:flex; gap:10px; align-items:flex-start; background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:11px; width:100%;
    text-align:left; font:inherit; color:inherit; cursor:pointer;
  }
  .pe-item.fresh{ animation:pop .35s ease; border-color:var(--blue-line); }
  @keyframes pop{ from{ transform:translateY(-6px); opacity:0; } to{ transform:none; opacity:1; } }
  .pe-thumb{ flex:0 0 auto; width:44px; height:44px; border-radius:8px; background:var(--surface-3); object-fit:cover; display:flex; align-items:center; justify-content:center; }
  .pe-thumb svg{ width:18px; height:18px; stroke:var(--text-faint); }
  .pe-body{ flex:1; min-width:0; }
  .pe-txt{ font-size:0.88rem; line-height:1.35; word-break:break-word; }
  .pe-meta{ font-size:0.72rem; color:var(--text-faint); margin-top:3px; }
  .pe-state{ flex:0 0 auto; font-size:0.68rem; font-weight:600; padding:3px 8px; border-radius:6px; border:1px solid var(--border); background:var(--surface-3); color:var(--text-dim); white-space:nowrap; }
  .pe-state.s0{ background:var(--blue-soft); color:var(--blue-bright); border-color:var(--blue-line); }
  .pe-state.s1{ background:var(--amber-soft); color:var(--amber); border-color:var(--amber-line); }
  .pe-state.s2{ background:var(--green-soft); color:var(--green); border-color:#1C4B2E; }
  .pe-tip{ font-size:0.74rem; color:var(--text-faint); margin:10px 0 0; }

  @media (prefers-reduced-motion:reduce){
    .brand-cursor{ animation:none; }
    .pe-item.fresh{ animation:none; }
    *{ transition-duration:.01ms !important; }
  }
</style>
</head>
<body>

<!-- ===================== HEADER ===================== -->
<header>
  <div class="brand">
    <span class="brand-mark">autonomIA Lab<span class="brand-cursor"></span></span>
  </div>
  <p class="brand-sub">Aplicaciones <span>útiles</span></p>
</header>


<!-- ===================== VISTA LISTA DE APLICACIONES ===================== -->
<main class="view active" id="view-apps">
  <button class="volver-btn" type="button" id="volverMiembros">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg> Panel de miembros
  </button>
  <div class="section-intro">
    <h2>Aplicaciones útiles</h2>
    <p>Un problema del día a día y la aplicación que lo resuelve. Toca una para probarla.</p>
  </div>
  <div class="mod-list" id="appsList"></div>
  <div class="apps-more">
    <h3>¿Tu problema no está aquí?</h3>
    <p>Cuéntanos qué te quita tiempo en tu negocio y lo convertimos en una aplicación.</p>
    <a class="btn-secondary" id="moreWa" href="#" target="_blank" rel="noopener">Contarlo por WhatsApp</a>
  </div>
</main>

<!-- ===================== VISTA DETALLE ===================== -->
<main class="view" id="view-app">
  <button class="volver-btn" type="button" data-go="">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg> Aplicaciones útiles
  </button>
  <div id="appRoot"></div>
</main>

<!-- ===================== MENÚ LATERAL ===================== -->
<div class="nav-menu-overlay" id="navMenuOverlay"></div>
<div class="nav-menu" id="navMenu">
  <p class="nav-menu-eyebrow">Menú</p>
  <button class="nav-menu-item" id="menuInicio" type="button">
    <span class="nav-menu-item-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8"/><path d="M5 10v10a1 1 0 001 1h3v-6h6v6h3a1 1 0 001-1V10"/></svg></span>
    <span class="nav-menu-item-text"><div class="t">Inicio</div><div class="d">Panel de miembros</div></span>
  </button>
  <button class="nav-menu-item active" id="menuApps" type="button">
    <span class="nav-menu-item-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M15.09 14c.18-.98.65-1.74 1.41-2.5A4.65 4.65 0 0018 8 6 6 0 006 8c0 1 .23 2.23 1.5 3.5.76.76 1.21 1.5 1.41 2.5"/></svg></span>
    <span class="nav-menu-item-text"><div class="t">Aplicaciones útiles</div><div class="d">Pruébalas aquí</div></span>
  </button>
  <button class="nav-menu-item" id="btnVolverInicio" type="button">
    <span class="nav-menu-item-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg></span>
    <span class="nav-menu-item-text"><div class="t">Salir</div><div class="d">Volver a autonomialab.es</div></span>
  </button>
</div>

<!-- ===================== NAV INFERIOR ===================== -->
<nav class="bottom-nav">
  <button class="hamburger-btn" id="menuBtn" aria-label="Abrir menú">
    <span class="hamburger-icon">
      <span class="h-line l1"></span>
      <span class="h-line l2"></span>
      <span class="h-line l3"></span>
    </span>
  </button>
</nav>

<script>
  const WHATSAPP_NUMBER = '34605288673';
  const waUrl = msg => 'https://wa.me/' + WHATSAPP_NUMBER + '?text=' + encodeURIComponent(msg);
  const ICON_CLOCK = '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>';
  const ICON_CAM = '<path d="M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z"/><circle cx="12" cy="13" r="4"/>';
  const svg = (inner, cls) => '<svg class="' + cls + '" viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' + inner + '</svg>';

  
  /* ---------- MENÚ ---------- */
  const menuBtn = document.getElementById('menuBtn');
  const navMenu = document.getElementById('navMenu');
  const navMenuOverlay = document.getElementById('navMenuOverlay');
  function cerrarMenu(){
    menuBtn.classList.remove('open'); navMenu.classList.remove('open'); navMenuOverlay.classList.remove('open');
  }
  function abrirMenu(){
    menuBtn.classList.add('open'); navMenu.classList.add('open'); navMenuOverlay.classList.add('open');
  }
  menuBtn.addEventListener('click', () => { if (navMenu.classList.contains('open')) cerrarMenu(); else abrirMenu(); });
  navMenuOverlay.addEventListener('click', cerrarMenu);
  document.getElementById('menuInicio').addEventListener('click', () => { window.location.href = 'miembros.html'; });
  document.getElementById('volverMiembros').addEventListener('click', () => { window.location.href = 'miembros.html'; });
  document.getElementById('menuApps').addEventListener('click', () => { cerrarMenu(); go(''); });
  document.getElementById('btnVolverInicio').addEventListener('click', () => { window.location.href = 'index.html'; });

  /* ---------- APLICACIONES ----------
     Para añadir una nueva: un objeto más en este array. */
  const APLICACIONES = [
    {
      id: 'control-horario',
      titulo: 'Control de horario',
      gancho: 'Entrada, salida y listo. Sabes quién está trabajando ahora mismo.',
      icono: ICON_CLOCK,
      dolor: 'Hojas de firmas, mensajes o un Excel. Y a fin de mes nadie sabe cuántas horas hizo cada uno.',
      titular: 'Que fichar sea tocar un botón.',
      intro: 'Cada empleado marca su entrada y su salida desde el móvil. Tú ves quién está trabajando ahora mismo y, a fin de mes, las horas de cada uno ya sumadas.',
      demoTitulo: 'Pruébalo: ficha tú',
      pasos: [
        'El empleado toca "Fichar entrada" al llegar.',
        'Toca "Fichar salida" al irse.',
        'Tú ves el registro de cada día y el total de horas, sin sumar nada.'
      ],
      wa: 'Hola, me interesa la aplicación de Control de horario para mi empresa. ¿Me cuentas cómo funcionaría?',
      demo: `
        <div class="fi-clock" id="fiClock">--:--:--</div>
        <span class="fi-chip" id="fiChip">Fuera de turno</span>
        <p class="fi-sub" id="fiSub">Toca el botón para fichar tu entrada.</p>
        <button class="fi-btn" id="fiBtn" type="button">Fichar entrada</button>
        <div class="fi-team">
          <div class="fi-team-head"><span>Equipo (ejemplo)</span><span><b id="fiCount">2</b> trabajando ahora</span></div>
          <div class="fi-row"><span class="fi-dot"></span><span class="fi-name">Marta</span><span class="fi-time">desde 07:58</span></div>
          <div class="fi-row"><span class="fi-dot"></span><span class="fi-name">Iván</span><span class="fi-time">desde 08:05</span></div>
          <div class="fi-row"><span class="fi-dot off"></span><span class="fi-name">Lucía</span><span class="fi-time">libra hoy</span></div>
          <div class="fi-row"><span class="fi-dot off" id="fiDot"></span><span class="fi-name">Tú</span><span class="fi-time" id="fiRowSub">sin fichar</span></div>
        </div>`,
      bind(root){
        const clock = root.querySelector('#fiClock'), chip = root.querySelector('#fiChip'), sub = root.querySelector('#fiSub'),
              btn = root.querySelector('#fiBtn'), count = root.querySelector('#fiCount'), rowSub = root.querySelector('#fiRowSub'),
              dot = root.querySelector('#fiDot');
        const hhmm = d => d.toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
        let inicio = null;
        const tick = () => { clock.textContent = new Date().toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit', second:'2-digit'}); };
        tick();
        const timer = setInterval(tick, 1000);
        btn.addEventListener('click', () => {
          if (!inicio){
            inicio = new Date();
            chip.textContent = 'Trabajando'; chip.classList.add('on');
            sub.textContent = 'Entrada registrada a las ' + hhmm(inicio) + '.';
            btn.textContent = 'Fichar salida'; btn.classList.add('out');
            count.textContent = '3'; rowSub.textContent = 'desde ' + hhmm(inicio); dot.classList.remove('off');
          } else {
            const fin = new Date();
            const min = Math.max(0, Math.round((fin - inicio) / 60000));
            sub.textContent = 'Salida a las ' + hhmm(fin) + '. Hoy: ' + Math.floor(min / 60) + ' h ' + String(min % 60).padStart(2, '0') + ' min.';
            chip.textContent = 'Fuera de turno'; chip.classList.remove('on');
            btn.textContent = 'Fichar entrada'; btn.classList.remove('out');
            count.textContent = '2'; rowSub.textContent = 'sin fichar'; dot.classList.add('off');
            inicio = null;
          }
        });
        return () => clearInterval(timer);
      }
    },
    {
      id: 'pendientes-obra',
      titulo: 'Pendientes de obra',
      gancho: 'Foto desde la obra y le llega a quien lo tiene que resolver.',
      icono: ICON_CAM,
      dolor: 'Llamadas y audios de WhatsApp para decir que falta material en una obra, y nadie sabe qué está resuelto.',
      titular: 'Foto desde la obra. Le llega a quien lo resuelve.',
      intro: 'El operario escribe qué falta y adjunta una foto. Aparece en el panel de la empresa, ordenado por obra, y le llega a la persona indicada. Nadie llama a nadie.',
      demoTitulo: 'Pruébalo: avisa de un pendiente',
      pasos: [
        'El operario describe lo que falta y hace una foto desde la obra.',
        'Llega al panel de la empresa y a la persona que lo tiene que resolver.',
        'Se marca "En camino" y "Resuelto", y el operario lo ve sin preguntar.'
      ],
      wa: 'Hola, me interesa la aplicación de Pendientes de obra para mi empresa. ¿Me cuentas cómo funcionaría?',
      demo: `
        <div class="pe-two">
          <div class="pe-field"><label for="peObra">Obra</label>
            <select id="peObra"><option>Calle Sol 12</option><option>Residencial Norte</option><option>Local Gran Vía</option></select></div>
          <div class="pe-field"><label for="pePara">Avisar a</label>
            <select id="pePara"><option>Compras</option><option>Jefe de obra</option><option>Oficina</option></select></div>
        </div>
        <div class="pe-field"><label for="peTexto">¿Qué hace falta?</label>
          <textarea id="peTexto" rows="2" maxlength="140" placeholder="Ej. falta pegante para el parqué"></textarea></div>
        <div class="pe-actions">
          <label class="pe-photo">${svg(ICON_CAM, '')} Foto<input type="file" id="peFoto" accept="image/*" capture="environment"></label>
          <button class="pe-send" id="peBtn" type="button" disabled>Enviar aviso</button>
        </div>
        <img class="pe-prev" id="peFotoPrev" alt="Foto adjunta">
        <div class="pe-inbox">
          <div class="pe-inbox-head"><span>Panel de la empresa (ejemplo)</span><span><b id="peCount">2</b> abiertos</span></div>
          <ul class="pe-list" id="peList"></ul>
          <p class="pe-tip">Toca un aviso para cambiar su estado.</p>
        </div>`,
      bind(root){
        const obra = root.querySelector('#peObra'), para = root.querySelector('#pePara'), texto = root.querySelector('#peTexto'),
              foto = root.querySelector('#peFoto'), prev = root.querySelector('#peFotoPrev'), btn = root.querySelector('#peBtn'),
              list = root.querySelector('#peList'), count = root.querySelector('#peCount');
        const ESTADOS = ['Nuevo', 'En camino', 'Resuelto'];
        let fotoUrl = null;
        const urls = [];
        const actualizar = () => {
          count.textContent = String(list.querySelectorAll('.pe-state:not(.s2)').length);
        };
        function item(data, fresh){
          const li = document.createElement('li');
          const b = document.createElement('button');
          b.type = 'button'; b.className = 'pe-item' + (fresh ? ' fresh' : '');
          let thumb;
          if (data.foto){ thumb = document.createElement('img'); thumb.className = 'pe-thumb'; thumb.src = data.foto; thumb.alt = 'Foto del pendiente'; }
          else { thumb = document.createElement('span'); thumb.className = 'pe-thumb'; thumb.innerHTML = svg(ICON_CAM, ''); }
          const body = document.createElement('span'); body.className = 'pe-body';
          const t = document.createElement('div'); t.className = 'pe-txt'; t.textContent = data.texto;
          const m = document.createElement('div'); m.className = 'pe-meta'; m.textContent = data.obra + ' · para ' + data.para + ' · ' + data.hora;
          body.appendChild(t); body.appendChild(m);
          const st = document.createElement('span'); st.className = 'pe-state s' + data.estado; st.textContent = ESTADOS[data.estado];
          b.appendChild(thumb); b.appendChild(body); b.appendChild(st);
          b.addEventListener('click', () => {
            data.estado = (data.estado + 1) % 3;
            st.className = 'pe-state s' + data.estado; st.textContent = ESTADOS[data.estado];
            actualizar();
          });
          li.appendChild(b);
          return li;
        }
        list.appendChild(item({texto:'Faltan 3 rodapiés de roble', obra:'Residencial Norte', para:'Compras', hora:'09:40', estado:1}, false));
        list.appendChild(item({texto:'Humedad en la pared del salón, hay que revisar', obra:'Calle Sol 12', para:'Jefe de obra', hora:'08:15', estado:0}, false));
        actualizar();
        texto.addEventListener('input', () => { btn.disabled = texto.value.trim().length === 0; });
        foto.addEventListener('change', () => {
          const f = foto.files && foto.files[0];
          if (!f){ fotoUrl = null; prev.classList.remove('show'); return; }
          fotoUrl = URL.createObjectURL(f); urls.push(fotoUrl);
          prev.src = fotoUrl; prev.classList.add('show');
        });
        btn.addEventListener('click', () => {
          const v = texto.value.trim();
          if (!v) return;
          const hora = new Date().toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
          list.insertBefore(item({texto:v, obra:obra.value, para:para.value, hora:hora, estado:0, foto:fotoUrl}, true), list.firstChild);
          texto.value = ''; btn.disabled = true; foto.value = ''; fotoUrl = null; prev.classList.remove('show');
          actualizar();
        });
        return () => { urls.forEach(u => URL.revokeObjectURL(u)); };
      }
    }
  ];

  /* ---------- NAVEGACIÓN POR HASH (el botón Atrás de Android funciona) ---------- */
  const views = { apps: document.getElementById('view-apps'), app: document.getElementById('view-app') };
  const appRoot = document.getElementById('appRoot');
  const appsList = document.getElementById('appsList');
  let limpiar = null;

  function go(h){ if (location.hash.slice(1) === h) route(); else location.hash = h; }
  function mostrar(nombre){
    Object.keys(views).forEach(k => views[k].classList.toggle('active', k === nombre));
    window.scrollTo(0, 0);
  }
  function pintarLista(){
    appsList.innerHTML = '';
    APLICACIONES.forEach(a => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'mod-card disponible app-card';
      b.innerHTML = '<div class="mod-icon-wrap">' + svg(a.icono, 'mod-icon') + '</div>' +
        '<div class="mod-text"><h3></h3><p></p></div>' +
        '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';
      b.querySelector('h3').textContent = a.titulo;
      b.querySelector('p').textContent = a.gancho;
      b.addEventListener('click', () => go('app-' + a.id));
      appsList.appendChild(b);
    });
  }
  function pintarApp(a){
    appRoot.innerHTML =
      '<div class="app-head"><p class="app-pain"></p><h2 class="app-h"></h2><p class="app-intro"></p></div>' +
      '<div class="demo-label"><b></b><span>Datos de ejemplo</span></div>' +
      '<div class="demo">' + a.demo + '</div>' +
      '<ol class="steps"><h3>Así funciona</h3></ol>' +
      '<div class="cta-block"><a class="btn-primary" id="appWa" target="_blank" rel="noopener">Quiero esto en mi empresa</a>' +
      '<p class="cta-hint">Te respondo yo por WhatsApp, sin compromiso.</p></div>';
    appRoot.querySelector('.app-pain').textContent = a.dolor;
    appRoot.querySelector('.app-h').textContent = a.titular;
    appRoot.querySelector('.app-intro').textContent = a.intro;
    appRoot.querySelector('.demo-label b').textContent = a.demoTitulo;
    const ol = appRoot.querySelector('.steps');
    a.pasos.forEach(p => { const li = document.createElement('li'); const s = document.createElement('span'); s.textContent = p; li.appendChild(s); ol.appendChild(li); });
    appRoot.querySelector('#appWa').href = waUrl(a.wa);
    limpiar = a.bind(appRoot);
  }
  function route(){
    if (limpiar){ limpiar(); limpiar = null; }
    const h = location.hash.slice(1);
    if (h.indexOf('app-') === 0){
      const a = APLICACIONES.find(x => 'app-' + x.id === h);
      if (a){ pintarApp(a); mostrar('app'); return; }
    }
    mostrar('apps');
  }

  document.querySelectorAll('[data-go]').forEach(el => el.addEventListener('click', () => go(el.getAttribute('data-go'))));
  document.getElementById('moreWa').href = waUrl('Hola, tengo un problema en mi negocio que me quita tiempo y me gustaría saber si una aplicación podría resolverlo.');

  pintarLista();
  window.addEventListener('hashchange', route);
  route();
</script>

</body>
</html>
